name: update-refining-margins
on:
  schedule:
    - cron: "0 21 * * 1-5"   # ~after NYMEX settle, weekdays (21:00 UTC)
  workflow_dispatch: {}        # allow manual run
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance        # fallback source only
      - run: python fetch_margins.py
      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "chore: update refining margins ($(date -u +%Y-%m-%d))

          Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01FnfWLh5W1FVc9MpHH2wdbt"
          git push
